<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #game-score-wrapper {
            display: flex;
            gap: 64px;
            margin-bottom: 20px;
            z-index: 10;
        }

        #game-score,
        #game-highscore {
            font-size: 28px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-weight: bold;
        }

        #game-canvas {
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90vw;
            max-height: 70vh;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #start-screen.hidden {
            display: none;
        }

        #start-screen h1 {
            color: white;
            font-size: 64px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        #start-button {
            padding: 20px 60px;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        #start-button:active {
            transform: translateY(-1px);
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            color: white;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: none;
            animation: pulse 1s ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        #countdown.show {
            display: block;
        }

        .instructions {
            color: white;
            font-size: 18px;
            margin-top: 30px;
            text-align: center;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <div id="start-screen">
            <h1>🐍 SNAKE GAME</h1>
            <button id="start-button">START GAME</button>
            <div class="instructions">
                <p>Use Arrow Keys to control the snake</p>
                <p>Eat food to grow and score points!</p>
            </div>
        </div>

        <div id="countdown"></div>

        <div id="game-score-wrapper">
            <h4 id="game-score">Score: 0</h4>
            <h4 id="game-highscore">High Score: 0</h4>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>

    <script src="main.js"></script>
</body>

</html>
